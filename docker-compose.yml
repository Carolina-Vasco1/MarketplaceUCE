name: marketplaceuce

services:
  # --------------------------
  # API Gateway
  # --------------------------
  gateway:
    build:
      context: ./backend
      dockerfile: gateway/Dockerfile
    ports:
      - "8000:8000"
    environment:
      JWT_SECRET: ${JWT_SECRET:-dev_secret_change_me}
      JWT_ALG: ${JWT_ALG:-HS256}
      FRONTEND_ORIGIN: ${FRONTEND_ORIGIN:-http://localhost:5173}

      AUTH_URL: http://auth-service:8001
      USER_URL: http://user-service:8010

      PRODUCT_URL: http://product-service:8002
      CATEGORY_URL: http://category-service:8011
      REVIEW_URL: http://review-service:8012

      ORDER_URL: http://order-service:8003
      PAYMENT_URL: http://payment-service:8004
      NOTIF_URL: http://notification-service:8005

      SEARCH_URL: http://search-service:8013
      ADMIN_URL: http://admin-service:8014
      REPORTING_URL: http://reporting-service:8015
      AI_URL: http://ai-service:8016
      BLOCKCHAIN_URL: http://blockchain-service:8017
      AD_CONNECTOR_URL: http://ad-connector-service:8018

      PAYPAL_CLIENT_ID: ${PAYPAL_CLIENT_ID:-}
      PAYPAL_ENV: ${PAYPAL_ENV:-sandbox}

    depends_on:
      - auth-service
      - user-service
      - product-service
      - category-service
      - review-service
      - order-service
      - payment-service
      - notification-service
      - search-service
      - admin-service
      - reporting-service
      - ai-service
      - blockchain-service
      - ad-connector-service
    restart: unless-stopped

  # --------------------------
  # Auth Service (Postgres + Redis)
  # --------------------------
  auth-service:
    build:
      context: ./backend
      dockerfile: services/auth-service/Dockerfile
    environment:
      POSTGRES_URL: ${AUTH_POSTGRES_URL:-postgresql+asyncpg://auth:auth@postgres:5432/auth_db}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}

      JWT_SECRET: ${JWT_SECRET:-dev_secret_change_me}
      JWT_ALG: ${JWT_ALG:-HS256}
      JWT_EXPIRES_MIN: ${JWT_EXPIRES_MIN:-1440}

      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  # --------------------------
  # User Service (Postgres)
  # --------------------------
  user-service:
    build:
      context: ./backend
      dockerfile: services/user-service/Dockerfile
    environment:
      POSTGRES_URL: ${USER_POSTGRES_URL:-postgresql+asyncpg://user:user@postgres:5432/user_db}
      JWT_SECRET: ${JWT_SECRET:-dev_secret_change_me}
      JWT_ALG: ${JWT_ALG:-HS256}
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  # --------------------------
  # Product Service (Mongo + Redis)
  # --------------------------
  product-service:
    build:
      context: ./backend
      dockerfile: services/product-service/Dockerfile
    environment:
      JWT_SECRET: ${JWT_SECRET:-dev_secret_change_me}
      JWT_ALG: ${JWT_ALG:-HS256}
      MONGO_URL: ${MONGO_URL:-mongodb://mongo:27017}
      MONGO_DB: ${MONGO_DB:-marketUce}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
    depends_on:
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  # --------------------------
  # Category Service (Mongo o Postgres)
  # - Si lo separaste del product-service
  # --------------------------
  category-service:
    build:
      context: ./backend
      dockerfile: services/category-service/Dockerfile
    environment:
      JWT_SECRET: ${JWT_SECRET:-dev_secret_change_me}
      JWT_ALG: ${JWT_ALG:-HS256}
      MONGO_URL: ${MONGO_URL:-mongodb://mongo:27017}
      MONGO_DB: ${MONGO_DB:-marketUce}
    depends_on:
      mongo:
        condition: service_healthy
    restart: unless-stopped

  # --------------------------
  # Review Service (Postgres)
  # --------------------------
  review-service:
    build:
      context: ./backend
      dockerfile: services/review-service/Dockerfile
    environment:
      POSTGRES_URL: ${REVIEW_POSTGRES_URL:-postgresql+asyncpg://review:review@postgres:5432/review_db}
      JWT_SECRET: ${JWT_SECRET:-dev_secret_change_me}
      JWT_ALG: ${JWT_ALG:-HS256}
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  # --------------------------
  # Search Service (Mongo Atlas / Mongo local)
  # --------------------------
  search-service:
    build:
      context: ./backend
      dockerfile: services/search-service/Dockerfile
    environment:
      MONGO_URL: ${MONGO_URL:-mongodb://mongo:27017}
      MONGO_DB: ${MONGO_DB:-marketUce}
    depends_on:
      mongo:
        condition: service_healthy
    restart: unless-stopped

  # --------------------------
  # Order Service (Postgres + Kafka)
  # --------------------------
  order-service:
    build:
      context: ./backend
      dockerfile: services/order-service/Dockerfile
    ports:
      - "8003:8003"
    environment:
      POSTGRES_URL: ${ORDER_POSTGRES_URL:-postgresql+asyncpg://order:order@postgres:5432/order_db}
      KAFKA_BOOTSTRAP: ${KAFKA_BOOTSTRAP:-kafka:29092}
      JWT_SECRET: ${JWT_SECRET:-dev_secret_change_me}
      JWT_ALG: ${JWT_ALG:-HS256}
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_started
    restart: unless-stopped

  # --------------------------
  # Payment Service (PayPal + Kafka)
  # --------------------------
  payment-service:
    build:
      context: ./backend
      dockerfile: services/payment-service/Dockerfile
    ports:
      - "8004:8004"
    environment:
      KAFKA_BOOTSTRAP: ${KAFKA_BOOTSTRAP:-kafka:29092}

      PAYPAL_ENV: ${PAYPAL_ENV:-sandbox}
      PAYPAL_CLIENT_ID: ${PAYPAL_CLIENT_ID:-}
      PAYPAL_CLIENT_SECRET: ${PAYPAL_CLIENT_SECRET:-}
      PAYPAL_BASE_URL: ${PAYPAL_BASE_URL:-https://api-m.sandbox.paypal.com}
    depends_on:
      kafka:
        condition: service_started
    restart: unless-stopped

  # --------------------------
  # Notification Service (Kafka + RabbitMQ)
  # --------------------------
  notification-service:
    build:
      context: ./backend
      dockerfile: services/notification-service/Dockerfile
    environment:
      KAFKA_BOOTSTRAP: ${KAFKA_BOOTSTRAP:-kafka:29092}
      RABBITMQ_URL: ${RABBITMQ_URL:-amqp://guest:guest@rabbitmq:5672/}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-}
    depends_on:
      kafka:
        condition: service_started
      rabbitmq:
        condition: service_started
    restart: unless-stopped

  # --------------------------
  # Admin Service (Postgres)
  # --------------------------
  admin-service:
    build:
      context: ./backend
      dockerfile: services/admin-service/Dockerfile
    environment:
      POSTGRES_URL: ${ADMIN_POSTGRES_URL:-postgresql+asyncpg://admin:admin@postgres:5432/admin_db}
      JWT_SECRET: ${JWT_SECRET:-dev_secret_change_me}
      JWT_ALG: ${JWT_ALG:-HS256}
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  # --------------------------
  # Reporting Service (Postgres)
  # --------------------------
  reporting-service:
    build:
      context: ./backend
      dockerfile: services/reporting-service/Dockerfile
    environment:
      POSTGRES_URL: ${REPORT_POSTGRES_URL:-postgresql+asyncpg://report:report@postgres:5432/report_db}
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  # --------------------------
  # AI Service (opcional)
  # --------------------------
  ai-service:
    build:
      context: ./backend
      dockerfile: services/ai-service/Dockerfile
    environment:
      AI_PROVIDER: ${AI_PROVIDER:-none}
    restart: unless-stopped

  # --------------------------
  # Blockchain Service (opcional)
  # --------------------------
  blockchain-service:
    build:
      context: ./backend
      dockerfile: services/blockchain-service/Dockerfile
    environment:
      CHAIN_ENV: ${CHAIN_ENV:-local}
    restart: unless-stopped

  # --------------------------
  # Ad Connector Service (opcional)
  # --------------------------
  ad-connector-service:
    build:
      context: ./backend
      dockerfile: services/ad-connector-service/Dockerfile
    environment:
      AD_PROVIDER: ${AD_PROVIDER:-none}
    restart: unless-stopped

  # --------------------------
  # Infra: Postgres
  # --------------------------
  postgres:
    image: postgres:16
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./backend/infra/postgres/init:/docker-entrypoint-initdb.d
    command: ["postgres", "-c", "max_connections=200"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d postgres"]
      interval: 5s
      timeout: 5s
      retries: 30
    restart: unless-stopped

  # --------------------------
  # Infra: Mongo
  # --------------------------
  mongo:
    image: mongo:7
    ports:
      - "27017:27017"
    volumes:
      - mongodata:/data/db
    healthcheck:
      test: ["CMD-SHELL", "mongosh --eval \"db.adminCommand('ping')\" --quiet || exit 1"]
      interval: 5s
      timeout: 10s
      retries: 30
    restart: unless-stopped

  # --------------------------
  # Infra: Redis
  # --------------------------
  redis:
    image: redis:7
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 30
    restart: unless-stopped

  # --------------------------
  # Infra: Zookeeper + Kafka
  # --------------------------
  zookeeper:
    image: confluentinc/cp-zookeeper:7.6.1
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "2181:2181"
    restart: unless-stopped

  kafka:
    image: confluentinc/cp-kafka:7.6.1
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181

      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:29092,PLAINTEXT_HOST://0.0.0.0:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT

      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
    restart: unless-stopped

  # --------------------------
  # Infra: RabbitMQ
  # --------------------------
  rabbitmq:
    image: rabbitmq:3-management
    ports:
      - "5672:5672"
      - "15672:15672"
    restart: unless-stopped

  # --------------------------
  # Observability
  # --------------------------
  prometheus:
    image: prom/prometheus:v2.55.0
    volumes:
      - ./backend/infra/prometheus:/etc/prometheus:ro
    ports:
      - "9090:9090"
    command:
      - --config.file=/etc/prometheus/prometheus.yml
    depends_on:
      - gateway
    restart: unless-stopped

  grafana:
    image: grafana/grafana:11.2.0
    ports:
      - "3000:3000"
    volumes:
      - ./infra/grafana/provisioning:/etc/grafana/provisioning
    depends_on:
      - prometheus
    restart: unless-stopped

volumes:
  pgdata:
  mongodata:
